version: "3.9"

services:
  home:
    build:
      context: ./home
      dockerfile: Dockerfile
    container_name: home_app
    restart: always
    expose:
      - "3000"   # iç network için port
    environment:
      - NODE_ENV=production

  cart:
    build:
      context: ./cart
      dockerfile: Dockerfile
    container_name: cart_app
    restart: always
    expose:
      - "3000"   # iç network için port
    environment:
      - NODE_ENV=production

  nginx:
    image: nginx:alpine
    container_name: nginx_proxy
    restart: always
    ports:
      - "3000:80"   # dışarıya 3000 açılır
    volumes:
      - ./nginx.conf:/etc/nginx/nginx.conf:ro
    depends_on:
      - home
      - cart
